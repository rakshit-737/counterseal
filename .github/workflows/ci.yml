name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counterseal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra test

      - name: Check formatting
        run: uv run --locked --extra test ruff format --check src tests scripts

      - name: Lint
        run: uv run --locked --extra test ruff check src tests scripts

      - name: Type check
        run: uv run --locked --extra test mypy

      - name: Test
        run: uv run --locked --extra test pytest -q

  web:
    name: Web quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --extra test

      - name: Audit Python dependencies
        run: uv run --locked --extra test pip-audit --skip-editable

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high
