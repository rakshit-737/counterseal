[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "counterseal"
version = "0.1.0"
description = "Counterseal domain and Phase 1 backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "rfc8785>=0.1.4,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "hypothesis>=6.100,<7.0",
    "ruff>=0.11,<1.0",
    "mypy>=1.15,<2.0",
    "pip-audit>=2.9,<3.0",
]

[project.scripts]
counterseal = "counterseal.backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/counterseal"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: requires disposable PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
